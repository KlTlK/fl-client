name: Build sing-box core (libsingbox)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - '.github/workflows/build-core.yml'

jobs:
  build-android:
    name: Android .aar (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone sing-box libbox source
        run: git clone --depth 1 https://github.com/SagerNet/sing-box.git core/singbox-src

      - name: Add golang.org/x/mobile to module graph
        working-directory: core/singbox-src
        run: |
          go get golang.org/x/mobile@latest
          go mod tidy

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Init gomobile
        run: gomobile init

      - name: Build libbox.aar (arm64-v8a)
        working-directory: core/singbox-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../../libs/android
          gomobile bind -v -androidapi 21 -target=android/arm64 -o ../../libs/android/libbox.aar ./experimental/libbox

      - uses: actions/upload-artifact@v4
        with:
          name: libbox-android-aar
          path: libs/android/libbox.aar

  build-windows:
    name: Windows sing-box.exe (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone sing-box source
        shell: bash
        run: git clone --depth 1 https://github.com/SagerNet/sing-box.git core/singbox-src

      - name: Build sing-box.exe
        working-directory: core/singbox-src
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../libs/windows
          go build -trimpath -ldflags "-s -w -buildid=" -o ../../libs/windows/sing-box.exe ./cmd/sing-box

      - uses: actions/upload-artifact@v4
        with:
          name: singbox-windows-exe
          path: libs/windows/sing-box.exe
