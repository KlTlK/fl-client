name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parser-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/proxy_parser_test.dart test/pinger_test.dart

  build-windows:
    name: Windows Build
    runs-on: windows-2022
    needs: parser-tests
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Fetch prebuilt sing-box.exe
        run: .\scripts\fetch_sing_box.ps1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Copy VC++ runtime DLLs
        shell: pwsh
        run: |
          $d = "build\windows\x64\runner\Release"
          @("C:\Windows\System32\vcruntime140.dll","C:\Windows\System32\vcruntime140_1.dll","C:\Windows\System32\msvcp140.dll") | ForEach-Object { if (Test-Path $_) { Copy-Item $_ "$d\" -Force } }
      - name: Copy sing-box.exe
        shell: pwsh
        run: Copy-Item "libs\windows\sing-box.exe" "build\windows\x64\runner\Release\" -Force
      - name: Create debug launcher
        shell: pwsh
        run: |
          $d = "build\windows\x64\runner\Release"
          $b = "@echo off`r`ntitle fl-client debug`r`necho Working dir: %~dp0`r`npowershell -Command `"Get-ChildItem -Path '%~dp0' -Recurse | Unblock-File`" 2>nul`r`necho Unblocked. Starting...`r`n`"%~dp0fl_client.exe`"`r`necho Exit code: %errorlevel%`r`nif exist `"%~dp0dart_alive.txt`" (echo Dart ran! & type `"%~dp0dart_alive.txt`")`r`nif exist `"%~dp0crash.log`" (echo === crash.log === & type `"%~dp0crash.log`")`r`npause"
          $b | Out-File "$d\DEBUG_RUN_ME.bat" -Encoding ascii
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Output -Force | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows\installer\fl_client.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-windows
          path: build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-installer
          path: Output/fl-client-setup.exe
