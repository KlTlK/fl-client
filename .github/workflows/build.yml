name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parser-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/proxy_parser_test.dart test/pinger_test.dart

  build-windows:
    name: Windows Build
    runs-on: windows-2022
    needs: parser-tests
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Fetch prebuilt sing-box.exe
        run: .\scripts\fetch_sing_box.ps1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Debug - list Release folder contents
        shell: pwsh
        run: |
          Write-Output "=== Release folder ==="
          Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse | ForEach-Object { Write-Output "$($_.FullName.Replace((Get-Location).Path + '\', ''))  $($_.Length) bytes" }
          Write-Output ""
          Write-Output "=== data folder ==="
          if (Test-Path "build\windows\x64\runner\Release\data") {
            Get-ChildItem -Path "build\windows\x64\runner\Release\data" -Recurse | ForEach-Object { Write-Output "$($_.FullName.Replace((Get-Location).Path + '\', ''))  $($_.Length) bytes" }
          } else {
            Write-Output "data/ folder DOES NOT EXIST!"
          }
          Write-Output ""
          Write-Output "=== flutter_assets ==="
          if (Test-Path "build\windows\x64\runner\Release\data\flutter_assets") {
            Get-ChildItem -Path "build\windows\x64\runner\Release\data\flutter_assets" | ForEach-Object { Write-Output "$($_.Name)  $($_.Length) bytes" }
          } else {
            Write-Output "flutter_assets/ DOES NOT EXIST!"
          }

      - name: Copy VC++ runtime DLLs
        shell: pwsh
        run: |
          $d = "build\windows\x64\runner\Release"
          $paths = @("C:\Windows\System32\vcruntime140.dll","C:\Windows\System32\vcruntime140_1.dll","C:\Windows\System32\msvcp140.dll")
          foreach ($p in $paths) { if (Test-Path $p) { Copy-Item $p "$d\" -Force; Write-Output "Copied $p" } }

      - name: Copy sing-box.exe
        shell: pwsh
        run: Copy-Item "libs\windows\sing-box.exe" "build\windows\x64\runner\Release\" -Force

      - name: Create debug launcher
        shell: pwsh
        run: |
          $d = "build\windows\x64\runner\Release"
          $bat = "@echo off`r`ntitle fl-client debug`r`necho Working dir: %~dp0`r`necho.`r`npowershell -Command `"Get-ChildItem -Path '%~dp0' -Recurse | Unblock-File`" 2>nul`r`necho Unblocked. Starting...`r`necho.`r`n`"%~dp0fl_client.exe`"`r`necho.`r`necho Exit code: %errorlevel%`r`necho.`r`nif exist `"%~dp0dart_alive.txt`" (`r`n    echo dart_alive.txt EXISTS - Dart code ran!`r`n    type `"%~dp0dart_alive.txt`"`r`n) else (`r`n    echo dart_alive.txt NOT FOUND - Dart never started`r`n)`r`nif exist `"%~dp0crash.log`" (`r`n    echo === crash.log ===`r`n    type `"%~dp0crash.log`"`r`n)`r`npause"
          $bat | Out-File "$d\DEBUG_RUN_ME.bat" -Encoding ascii

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\fl-client-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-windows
          path: dist/fl-client-windows.zip
