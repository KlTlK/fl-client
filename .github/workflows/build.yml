name: Build Windows + Setup artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parser-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/proxy_parser_test.dart test/pinger_test.dart

  build-windows:
    name: Windows EXE + sing-box core
    runs-on: windows-2022
    needs: parser-tests
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - name: Build sing-box.exe from source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/SagerNet/sing-box.git core/singbox-src
          cd core/singbox-src
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid=" -o ../../libs/windows/sing-box.exe ./cmd/sing-box

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Assemble setup package
        shell: bash
        run: |
          mkdir -p dist/fl-client-windows
          # Flutter build output
          cp -r build/windows/x64/runner/Release/* dist/fl-client-windows/
          # sing-box core next to the exe
          cp libs/windows/sing-box.exe dist/fl-client-windows/
          # launcher / readme
          cp scripts/install.bat dist/fl-client-windows/ 2>/dev/null || true
          cp scripts/README-WINDOWS.txt dist/fl-client-windows/ 2>/dev/null || true

      - name: Zip setup package
        shell: bash
        run: |
          cd dist
          powershell Compress-Archive -Path fl-client-windows -DestinationPath fl-client-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-windows-setup
          path: dist/fl-client-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-raw
          path: build/windows/x64/runner/Release/
