name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parser-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/proxy_parser_test.dart test/pinger_test.dart

  build-windows:
    name: Windows Build
    runs-on: windows-2022
    needs: parser-tests
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Fetch prebuilt sing-box.exe
        run: .\scripts\fetch_sing_box.ps1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Create debug launcher
        shell: pwsh
        run: |
          $d = "build\windows\x64\runner\Release"
          $bat = "@echo off`r`ntitle fl-client debug`r`necho Working dir: %~dp0`r`necho Starting fl_client.exe...`r`necho.`r`nstart /wait `"`"%~dp0fl_client.exe`"`"`r`necho.`r`necho Exit code: %errorlevel%`r`necho.`r`nif exist `"%~dp0crash.log`" (`r`n    echo === crash.log ===`r`n    type `"%~dp0crash.log`"`r`n    echo ===================`r`n) else (`r`n    echo No crash.log found.`r`n)`r`necho.`r`npause"
          $bat | Out-File "$d\DEBUG_RUN_ME.bat" -Encoding ascii

      - name: Copy sing-box.exe to Release
        shell: pwsh
        run: |
          Copy-Item "libs\windows\sing-box.exe" "build\windows\x64\runner\Release\" -Force

      - name: Zip everything
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\fl-client-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-windows
          path: dist/fl-client-windows.zip
