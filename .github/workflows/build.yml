name: Build Windows + Setup artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parser-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/proxy_parser_test.dart test/pinger_test.dart

  build-windows:
    name: Windows EXE + sing-box core
    runs-on: windows-2022
    needs: parser-tests
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Fetch prebuilt sing-box.exe
        run: .\scripts\fetch_sing_box.ps1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Assemble setup package
        shell: pwsh
        run: |
          $dest = "dist\fl-client-windows"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $dest -Recurse -Force
          Copy-Item -Path "libs\windows\sing-box.exe" -Destination $dest -Force
          if (Test-Path "scripts\install.bat") { Copy-Item "scripts\install.bat" $dest -Force }
          if (Test-Path "scripts\README-WINDOWS.txt") { Copy-Item "scripts\README-WINDOWS.txt" $dest -Force }

      - name: Zip setup package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\fl-client-windows" -DestinationPath "dist\fl-client-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fl-client-windows-setup
          path: dist/fl-client-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-raw
          path: build/windows/x64/runner/Release/
