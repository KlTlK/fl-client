name: fl_client
description: Sing-box VPN client in FlClash style. Windows build.
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  animated_toggle_switch: ^0.8.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  ffi: ^2.1.0
  path_provider: ^2.1.2
  path_provider_windows: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^12.0.0

flutter:
  uses-material-design: true
